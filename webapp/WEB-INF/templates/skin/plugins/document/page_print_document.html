<#include "/skin/themes/global_theme_commons.ftl" />
<#if plugin_theme??><#assign thetheme=plugin_theme /><#elseif theme??><#assign thetheme=theme /></#if>
<!DOCTYPE html>
<html lang="${.lang}">
<head>
<title>#i18n{document.page_print_document.labelPrintPreview}</title>
<base href="${base_url}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<#if themeCSSLinks??>
<@themeCSSLinks />
<#elseif thetheme??>
<link href="${thetheme.pathCss!}/bootstrap.min.css?theme=${thetheme.codeTheme!}${thetheme.themeVersion!}" crossorigin="anonymous" rel="stylesheet">
<link href="${thetheme.pathCss!}/theme.min.css?theme=${thetheme.codeTheme!}${thetheme.themeVersion!}" crossorigin="anonymous" rel="stylesheet">
</#if>
</head>
<body>
<main class="container my-4">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h1 class="h3 mb-0">${portal_domain}</h1>
		<button type="button" class="btn btn-secondary d-print-none" id="print-document">#i18n{document.document_content_service.buttonPrint}</button>
	</div>
	${preview}
</main>
<script>
document.getElementById('print-document').addEventListener('click', function() {
	window.print();
});
</script>
</body>
</html>
